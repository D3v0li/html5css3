<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Aprenda HTML5 e CSS3 de forma simples, prática e objetiva desenvolvendo passo a passo do zero até a hospedagem um site One Page moderno e responsivo ">
    <link rel="shortcut icon" href="img/favicon.png" type="image/x-icon">
    <link rel="stylesheet" href="estilo.css">
    <title>HTML5 e CSS3 - One Page Site</title>
</head>
<body>
    <!--inici0 cabeçalho-->
    <header id="inicio">
        <div class="container flex">
            <div id="logo">
                <img src="img/logo_skate.webp" alt="hal 9000">
            </div>
            <!--MENU-->
            <nav>
                <input type="checkbox" id="check">
                <label for="check">&#x268c;</label>
                <ul>
                    <li><a href="#inicio">Início</a></li>
                    <li><a href="#sobre">Sobre</a></li>
                    <li><a href="#conteudo">Conteúdo</a></li>
                    <li><a href="#contato">Contato</a></li>
                </ul>
            </nav>
        </div>
    </header>
    <!--fim cabeçalho-->

    <!--inicio destaque-->
    <main>
        <div class="container">
            <h1>SKATE NA VÊIA</h1>
            <h2>A SUA VISÃO DO SKATE</h2>
            <a href="https://www.youtube.com/playlist?list=PLbEOwbQR9lqySIIlPJ-Qwo4f4HSuXVeWk"
             target="_blank" class="Botao">Saiba + </a>
        </div>    
    </main>
    <!--fim destaque-->

    <!--inicio sobre-->
    <section id="sobre">
        <div class="container">
            <h2>Aprender na prática</h2>
        </div>  
    </section>
    <!--fim sobre-->

    <!--inicio one page-->
    <section>
        <div class="container">
            <h2>One Page Site</h2>
        </div>
    </section>
    <!--fim one page-->

    <!--inicio wireframe-->
    <section>
        <div class="container">
            <h2>Wire Frame</h2>
        </div>
    </section>
    <!--fim wireframe-->

    <!--inicio conteudo-->
    <section id="conteudo">
       <div class="container">
            <h2>Conteúdo</h2>
            <h3>HTML5</h3>
            <h3>BOX MODEL CSS</h3>
            <h3>BREAK POINTS</h3>
       </div>
    </section>
    <!--fim conteudo-->

    <!--inicio rodape-->
    <footer id="contato">
        <div class="container">

        </div>
    </footer>
    <!--fim rodape-->
    <a href="#inicio" id="topo"><img src="img/topo.png" alt="topo do site"></a>
</body>
</html>
